<!-- Cases & Doctor Section -->
<section class="cases-doctor-section" id="cases" data-aos="fade-up">
  <div class="cases-doctor-content">
    <!-- Left: Cases Section -->
    <div class="cases-column" data-aos="fade-right" data-aos-delay="100">
      <div class="cases-wrapper">
        <h2 class="cases-title">بعض من حالات التجميل وزراعة الاسنان</h2>
        <h3 class="case-slider-heading">تبييض</h3>
        <div class="before-after-slider">
          <div class="slider-container">
            <div class="after-image">
              <img src="images/case-1-before.png" alt="Before" />
            </div>
            <div class="before-image">
              <img src="images/case-1-after.png" alt="After" />
            </div>
            <div class="slider-handle">
              <div class="handle-line"></div>
              <div class="handle-circle">
                <i class="bx bx-chevron-left"></i>
                <i class="bx bx-chevron-right"></i>
              </div>
            </div>
            <div class="slider-labels">
              <span class="label-before">Before</span>
              <span class="label-after">After</span>
            </div>
          </div>
        </div>
        <h3 class="case-slider-heading">زراعة أسنان</h3>
        <div class="before-after-slider">
          <div class="slider-container">
            <div class="after-image">
              <img src="images/cases/الزراعة/case-1-before.jpeg" alt="Before" />
            </div>
            <div class="before-image">
              <img src="images/cases/الزراعة/case-1-after.jpeg" alt="After" />
            </div>
            <div class="slider-handle">
              <div class="handle-line"></div>
              <div class="handle-circle">
                <i class="bx bx-chevron-left"></i>
                <i class="bx bx-chevron-right"></i>
              </div>
            </div>
            <div class="slider-labels">
              <span class="label-before">Before</span>
              <span class="label-after">After</span>
            </div>
          </div>
        </div>
        <h3 class="case-slider-heading">تركيبات زيركون</h3>
        <div class="before-after-slider">
          <div class="slider-container">
            <div class="after-image">
              <img src="images/cases/تركيبات زيركون/cas-2-before.jpeg" alt="Before" />
            </div>
            <div class="before-image">
              <img src="images/cases/تركيبات زيركون/case-2-after.jpeg" alt="After" />
            </div>
            <div class="slider-handle">
              <div class="handle-line"></div>
              <div class="handle-circle">
                <i class="bx bx-chevron-left"></i>
                <i class="bx bx-chevron-right"></i>
              </div>
            </div>
            <div class="slider-labels">
              <span class="label-before">Before</span>
              <span class="label-after">After</span>
            </div>
          </div>
        </div>
        <div class="cases-cta">
          <button class="cases-btn" id="cases-toggle-btn" type="button">
            المزيد من الحالات
          </button>
        </div>

        <div class="cases-gallery" id="cases-gallery">
          <h3 class="cases-gallery-title">معرض الحالات</h3>
          <div class="cases-grid">
            <div class="case-item">
              <img
                src="images/cases/الفينير/PHOTO-2025-11-29-19-50-16.jpg"
                alt="Veneers case"
                loading="lazy"
              />
              <div class="case-label">فينير</div>
            </div>
            <div class="case-item">
              <img
                src="images/cases/تبيض بالليزر/WhatsApp Image 2025-11-29 at 19.50.19 (1).jpeg"
                alt="Laser whitening"
                loading="lazy"
              />
              <div class="case-label">تبيض بالليزر</div>
            </div>
            <div class="case-item">
              <video controls preload="metadata">
                <source
                  src="images/cases/حشو عادي/case-1.mp4"
                  type="video/mp4"
                />
                متصفحك لا يدعم تشغيل الفيديو.
              </video>
              <div class="case-label">حشو عادي - فيديو</div>
            </div>
            <div class="case-item">
              <video controls preload="metadata">
                <source
                  src="images/cases/حشو عصب/case-2.mp4"
                  type="video/mp4"
                />
                متصفحك لا يدعم تشغيل الفيديو.
              </video>
              <div class="case-label">حشو عصب - فيديو</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
